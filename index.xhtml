    <script>
      // 加载页（T108）：计时起点、战况文案轮换、卡住 6 秒没进度就提示（进度由游戏包里的 src/boot.ts 推）
      (function () {
        var B = (window.__TANK_BOOT__ = { marks: [['html', Math.round(performance.now())]], last: performance.now(), pre: 1 });
        var el = document.getElementById('boot');
        var tip = el.querySelector('.boot-tip');
        var label = el.querySelector('.boot-label');
        var tips = ['侦察：前方发现装甲集群', '工兵正在排除雷区', '补给车队已抵达前沿', '炮兵阵地完成校射', '无线电静默，等待命令', '主炮弹药装填完毕', '天气晴，适合突击', '前沿观察哨报告敌情'];
        var i = Math.floor(Math.random() * tips.length);
        var n = 0;
        tip.textContent = tips[i];
        var timer = setInterval(function () {
          if (!el.isConnected || el.classList.contains('boot-fail')) return clearInterval(timer);
          var slow = performance.now() - B.last > 6000;
          tip.classList.toggle('boot-slow', slow);
          if (slow) tip.textContent = label.textContent === '正在下载' ? '网络较慢，请稍候' : '还在加载，请稍候';
          else tip.textContent = tips[++n % 3 === 0 ? (i = (i + 1) % tips.length) : i];
        }, 1000);
      })();
    </script>

        <button id="title-set-back" type="button" class="outline">返回</button>
      </section>

      <section id="save-box" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="save-head">
        <h2 id="save-head"></h2>
        <div id="save-lines"></div>
        <textarea id="save-paste" hidden="hidden" rows="4" placeholder="把导出的存档文本粘贴到这里" aria-label="存档文本" spellcheck="false" autocomplete="off"></textarea>
        <p id="save-warn" role="alert" hidden="hidden"></p>
        <div id="save-btns"></div>
      </section>

      <section id="pause" class="overlay hidden">
        <p class="eyebrow">作战已暂停</p><h2>等待指令</h2>
        <div class="pause-main">
          <p id="pause-summary"></p>
          <button id="resume-btn" type="button">继续作战</button>
          <div class="pause-row"><button id="sub-pause-btn" type="button" class="outline">武器改装</button><button id="route-pause-btn" type="button" class="outline">资料图鉴</button><button id="guide-pause-btn" type="button" class="outline hidden">操作指南</button></div>
          <div class="pause-row"><button id="settings-open-btn" type="button" class="outline">设置</button><button id="shot-pause-btn" type="button" class="outline">分享</button></div>
          <div class="pause-display"><button id="pause-fullscreen" type="button" class="outline" data-fullscreen="data-fullscreen" aria-pressed="false">全屏</button><button id="pause-install" type="button" class="outline" data-install="data-install">添加桌面</button></div>
          <button id="savequit-btn" type="button" class="outline">保存并离场<small>保留进度，本局不结算</small></button>
          <p id="pause-save-note" role="status"></p>
          <button id="quit-btn" type="button" class="link quiet">结束本局</button>
        </div>
        <div class="pause-settings hidden">
          <div class="settings" data-scope="pause"></div>
          <button id="settings-back-btn" type="button" class="outline">返回</button>
        </div>
      </section>

      <section id="route" class="overlay hidden" aria-label="资料图鉴">
        <div class="route-top"><button id="route-back" type="button" class="link">‹ 返回</button><h2>资料图鉴</h2><i></i></div>
        <div class="route-books"></div>
        <div class="route-tabs"></div>
        <div class="route-cores"></div>
        <div class="route-body"></div>
      </section>

      <section id="shot-view" class="overlay hidden" aria-label="截图预览">
        <img id="shot-img" alt="截图" />
        <div class="shot-row">
          <a id="shot-save" class="btn" download="钢铁破坏者截图.jpg">保存</a>
          <button id="shot-share" type="button">分享</button>
          <button id="shot-close" type="button" class="ghost">关闭</button>
        </div>
      </section>

      <section id="gameover" class="overlay hidden">
        <h2 id="go-title">战斗结束</h2><p id="go-mode" class="sub"></p>
        <p id="go-rating"></p>
        <p class="go-dist"><b id="go-dist">0</b> 米</p>
        <p id="go-best"></p>
        <p class="sub"><span id="go-stats"></span></p>
        <div id="go-medals"></div>
        <p id="go-high"></p>
        <div id="go-econ"></div>
        <p id="go-score"></p>
        <button id="go-share" type="button">分享战绩</button>
        <p id="run-retention" class="run-retention">本局装备下次重选<br />军衔军票继续保留</p>
        <div class="go-row"><button id="restart" type="button">再来一局</button><button id="prepare-again" type="button" class="outline">调整出击</button></div>
        <button id="menu-btn" type="button" class="link">返回主界面</button>
        <details id="go-rep"><summary>战报</summary><div id="go-report"></div></details>
      </section>
      <section id="ranks" class="overlay hidden">
        <h2>排行榜</h2><p class="sub">本机纪录</p>
        <ol id="ranks-list"></ol>
        <button id="ranks-close" type="button">返回</button>
      </section>
    </main>
  </body>
</html>
